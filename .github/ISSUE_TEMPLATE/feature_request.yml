name: Feature request
description: Suggest a focused improvement to Zenex.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or workflow limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: API, data or deployment impact
      description: Note any compatibility, migration, security or operational implications.
